apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: foundry-password
  annotations:
    kro.run/allow-breaking-changes: "true"
spec:
  schema:
    group: foundry.platform
    apiVersion: v1alpha1
    kind: FoundryPassword
    spec:
      type: string | required=true default="default" description="Type of password - 'default' (shared per user) or 'instance' (unique per instance)"
      rotateRequestedAt: string | default="" description="Timestamp to force password regeneration"
      instanceRef:
        name: string | default="" description="Name of the FoundryInstance this password is for (only for type 'instance')"
    status:
      phase: '${externalSecret.status.conditions.exists(c, c.type == "Ready" && c.status == "True") ? "Ready" : "Pending"}'
      ready: ${externalSecret.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      message: '${externalSecret.status.conditions.exists(c, c.type == "Ready") ? externalSecret.status.conditions.filter(c, c.type == "Ready")[0].message : ""}'
      secretName: ${schema.metadata.name}
      lastRefreshed: ${externalSecret.status.refreshTime}
  resources:
    - id: externalSecret
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
          annotations:
            force-sync: '${schema.spec.rotateRequestedAt != "" ? schema.spec.rotateRequestedAt : omit()}'
          labels:
            foundry.platform/password: ${schema.metadata.name}
            foundry.platform/password-type: ${schema.spec.type}
            foundry.platform/instance: '${schema.spec.instanceRef.name != "" ? schema.spec.instanceRef.name : omit()}'
            foundry.platform/owner-id: '${has(schema.metadata.labels) && "foundry.platform/owner-id" in schema.metadata.labels ? schema.metadata.labels["foundry.platform/owner-id"] : omit()}'
            managed-by: kro
        spec:
          refreshPolicy: OnChange
          refreshInterval: "0"
          target:
            name: ${schema.metadata.name}
            template:
              data:
                adminPassword: "{{ .password }}"
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: foundry-password
