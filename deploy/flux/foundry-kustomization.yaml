---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kratix-foundry
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/you-randomly/kratix-foundry.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundry-platform
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: kratix-foundry
  path: ./deploy/kro
  dependsOn:
    - name: kro
      namespace: kro-system
