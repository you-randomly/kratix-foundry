---
apiVersion: v1
kind: Namespace
metadata:
  name: kro-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kro
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://registry.k8s.io/kro/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
  namespace: kro-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kro
      version: "0.9.x"
      sourceRef:
        kind: HelmRepository
        name: kro
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
